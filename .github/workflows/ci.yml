# ALL SHARE continuous integration.
#
# Four jobs, in rough order of how quickly they catch a mistake:
#
#   checks    gofmt, vet and the Go unit tests. Seconds.
#   crosslang the JavaScript implementations against the Go ones, byte for byte.
#             The wire protocol and the pairing exchange each exist twice, and
#             two implementations that disagree surface to a user as "that code
#             did not work" with no way to tell which side is wrong.
#   e2e       A real rendezvous, a real agent with a real WebRTC stack, and a
#             real Chromium loading the real client from a real file:// URL.
#   windows   Cross-compiles the agent, native library included, and checks the
#             resulting .exe imports nothing that is not part of Windows.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: The cross-language vectors must be reproducible
        # They are regenerated by the test run above. A diff here means the key
        # exchange or the fingerprint changed, which is worth a deliberate look
        # rather than a silent commit.
        run: git diff --exit-code -- shared/pair/testdata/ shared/idkey/testdata/

  crosslang:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate the Go test vectors
        run: go test ./shared/...

      - name: Client logic
        run: node test/tools/client-unit.js

      - name: The JavaScript encoder against Go, byte for byte
        run: node test/tools/protocol-conformance.js

      - name: The browser pairing exchange and fingerprints against Go
        run: node test/tools/pairing-interop.js

  e2e:
    name: End to end, in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the browser harness
        working-directory: test/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: .
        env:
          ALLSHARE_E2E: "1"
          # playwright-core resolves its own download, so let the harness find
          # it rather than pinning a path that changes with every release.
          ALLSHARE_CHROME: ""
        run: |
          # Locate whatever Chromium playwright just installed.
          chrome="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -n 1)"
          if [ -z "$chrome" ]; then
            echo "no Chromium was installed" >&2
            exit 1
          fi
          echo "using $chrome"
          ALLSHARE_CHROME="$chrome" go test -v -timeout 15m ./test/e2e/

      - name: Keep the session screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts/
          if-no-files-found: ignore

  windows:
    name: Windows agent cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cache the libopus build
        uses: actions/cache@v4
        with:
          path: .deps
          key: opus-${{ runner.os }}-mingw-1.5.2

      - name: Build the agent
        run: bash build/build-agent.sh

      - name: The executable must import only Windows system DLLs
        # A build that quietly picks up libstdc++-6.dll produces an agent that
        # fails on every machine but the one that built it. -static-libstdc++
        # is a g++ driver option and cgo links through gcc, where it is silently
        # ignored, so this is a mistake that can only be caught here.
        run: |
          imports="$(x86_64-w64-mingw32-objdump -p dist/windows/allshare-agent.exe \
            | grep 'DLL Name' | awk '{print tolower($3)}' | sort -u)"
          echo "$imports"
          allowed="advapi32.dll d3d11.dll dxgi.dll kernel32.dll mf.dll mfplat.dll msvcrt.dll ole32.dll oleaut32.dll shell32.dll user32.dll userenv.dll winmm.dll ws2_32.dll wtsapi32.dll"
          for dll in $imports; do
            case " $allowed " in
              *" $dll "*) ;;
              *) echo "unexpected import: $dll" >&2; exit 1 ;;
            esac
          done

      - name: Vet the Windows build
        # cgo must be on: the capture package is a bridge to the native library
        # and does not type-check without it. unsafe.Pointer is unavoidable at
        # the Win32 boundary — those uses are isolated and reviewed, and
        # everything else vet checks still applies.
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go vet -unsafeptr=false ./agent/... ./internal/... ./shared/...

      - name: Keep the built agent
        uses: actions/upload-artifact@v4
        with:
          name: allshare-agent-windows-amd64
          path: dist/windows/allshare-agent.exe
